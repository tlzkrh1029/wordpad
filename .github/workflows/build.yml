name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DRICHPAD_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Converter unit tests
        if: matrix.arch == 'x64'
        run: ctest --test-dir build -C Release --output-on-failure

      # The self test drives the real main window on a real Windows desktop:
      # formatting, file formats, printing (to PDF) and the user interface.
      - name: Self test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path selftest | Out-Null
          $log = Join-Path (Resolve-Path selftest) "selftest.log"
          $p = Start-Process -FilePath "build\Release\RichPad.exe" -ArgumentList "/selftest", "`"$log`"" -PassThru
          if (-not $p.WaitForExit(300000)) {
            $p.Kill()
            Write-Host "::error::The self test timed out"
          }
          if (Test-Path $log) { Get-Content $log -Encoding UTF8 }
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::The self test failed (exit code $($p.ExitCode))"
            exit 1
          }

      - name: Upload RichPad.exe
        uses: actions/upload-artifact@v4
        with:
          name: RichPad-${{ matrix.arch }}
          path: build/Release/RichPad.exe
          if-no-files-found: error

      - name: Upload self test results
        if: always() && matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: selftest-results
          path: selftest/
          if-no-files-found: ignore

  linux:
    name: Linux (unit tests and MinGW cross build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Converter unit tests (with sanitizers)
        run: tests/run_convert_tests.sh

      # Damaged DOCX / ODT / RTF files must never crash the converters.
      - name: Converter fuzzing (short run)
        run: tests/run_convert_fuzz.sh 3000 1

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64

      - name: Cross build
        run: |
          cmake -S . -B build-mingw -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mingw --parallel
